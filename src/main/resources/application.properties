bot.enabled=${BOT_ENABLED:true}
bot.name=${TELEGRAM_BOT_NAME:HoroscopeDemoBot}
bot.token=${TELEGRAM_BOT_TOKEN:}
bot.workers=${BOT_WORKERS:8}
bot.queue-capacity=${BOT_QUEUE_CAPACITY:128}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Test}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true

astro.ephemeris-path=${EPHEMERIS_PATH:./ephemers}
astro.cache.charts.maximum-size=${CHART_CACHE_SIZE:2000}
astro.cache.charts.ttl=${CHART_CACHE_TTL:PT6H}
astro.cache.descriptions.maximum-size=${DESCRIPTION_CACHE_SIZE:5000}
astro.cache.descriptions.ttl=${DESCRIPTION_CACHE_TTL:PT1H}
